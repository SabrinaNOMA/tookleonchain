name: Deploy to OVH Preprod

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  web-deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
    - name: Get latest code
      uses: actions/checkout@v4
      
    - name: Sync files to OVH via SFTP
      uses: Dylan700/sftp-upload-action@v1.1.8
      with:
        server: ${{ secrets.OVH_FTP_SERVER }}
        username: ${{ secrets.OVH_FTP_USERNAME }}
        password: ${{ secrets.OVH_FTP_PASSWORD }}
        port: 22
        local_path: '.'
        remote_path: '/home/wxejrxt/preprod'
        exclude_ignored: true
        # Excludes can be defined as files/directories to ignore
        exclude: |
          .git*
          .github
          tests
          scratch
          config.preprod.php
          config.example.php
          *.md
