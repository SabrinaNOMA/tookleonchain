<!-- Page-specific JavaScript -->
<script>
document.addEventListener('DOMContentLoaded', function() {
    const inviteCodeInput = document.getElementById('invite-code');
    const inviteeListContainer = document.getElementById('invitee-list');
    const copyInviteButton = document.getElementById('copy-invite-button');
    const shareInviteButton = document.getElementById('share-invite-button');
    const modal = { overlay: document.getElementById('custom-modal'), message: document.getElementById('modal-message'), closeBtn: document.getElementById('modal-close-button') };
    
    modal.closeBtn.addEventListener('click', () => modal.overlay.classList.remove('visible'));
    function showModal(msg) { modal.message.textContent = msg; modal.overlay.classList.add('visible'); }

    // This function is now in layout.php, but it's good to keep a version here in case of single-page use.
    const renderUserInfo = (user) => {
        if (!user) return;
        const fullName = `${user.first_name || ''} ${user.last_name || ''}`.trim();
        const userNameEl = document.getElementById('user-name');
        if (userNameEl) userNameEl.textContent = fullName || user.email || 'Investor';
        const userEmailEl = document.getElementById('user-email');
        if (userEmailEl) userEmailEl.textContent = user.email || 'No email';
        let initials = (user.first_name?.[0] || '') + (user.last_name?.[0] || '');
        if (!initials && user.email) initials = user.email[0];
        else if (!initials) initials = 'I';
        const userInitialsEl = document.getElementById('user-initials');
        if (userInitialsEl) userInitialsEl.textContent = initials.toUpperCase();
    };

    async function fetchInviteData() {
        try {
            const response = await fetch('/backend/invites_backend.php');
            if (!response.ok) {
                if (response.status === 401) {
                    window.location.href = '/user/l01_login.html';
                }
                throw new Error(`HTTP Error: ${response.status}`);
            }
            const data = await response.json();
            if (data.error) throw new Error(data.error);

            // Populate user info in the layout header
            renderUserInfo(data.userInfo);
            inviteCodeInput.value = data.invite_code || 'N/A';
            
            inviteeListContainer.innerHTML = '';
            if (data.invitees && data.invitees.length > 0) {
                data.invitees.forEach(invitee => {
                    const statusClass = invitee.status === 'Completed' ? 'status-completed' : 'status-pending';
                    const item = `
                        <div class="invitee-list-item">
                            <span>${invitee.referee_email}</span>
                            <span class="invitee-status ${statusClass}">${invitee.status}</span>
                        </div>`;
                    inviteeListContainer.insertAdjacentHTML('beforeend', item);
                });
            } else {
                inviteeListContainer.innerHTML = '<p class="text-sm text-gray-500 text-center">You haven\'t invited anyone yet.</p>';
            }
        } catch (error) {
            console.error("Fetch invite data error:", error);
            showModal("Could not load your invite information.");
        }
    }

    function copyCode() {
        if (!inviteCodeInput.value || inviteCodeInput.value === 'Loading...') return;
        // Use document.execCommand('copy') for better browser compatibility in iframes
        const tempInput = document.createElement('input');
        tempInput.value = inviteCodeInput.value;
        document.body.appendChild(tempInput);
        tempInput.select();
        try {
            document.execCommand('copy');
            const originalText = copyInviteButton.textContent;
            copyInviteButton.textContent = 'Copied!';
            copyInviteButton.classList.add('copied');
            setTimeout(() => {
                copyInviteButton.textContent = originalText;
                copyInviteButton.classList.remove('copied');
            }, 2000);
        } catch (err) {
            console.error('Failed to copy code.', err);
            showModal('Failed to copy code to clipboard.');
        } finally {
            document.body.removeChild(tempInput);
        }
    }
    
    copyInviteButton.addEventListener('click', copyCode);
    shareInviteButton.addEventListener('click', copyCode);
    
    fetchInviteData();
});
</script>
