<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Test Onramp CDP (JWT HS256)</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f9fafb; }
    .card { max-width: 480px; margin: 40px auto; border-radius: 1rem; }
  </style>
</head>
<body>
  <div class="container mt-5">
    <div class="card shadow-sm p-4">
      <h4 class="mb-3 text-center">💶 Test Onramp – Session Token (JWT HS256)</h4>

      <div class="mb-3">
        <label class="form-label">Adresse du wallet destinataire</label>
        <input type="text" class="form-control" id="wallet_address" placeholder="0x1234abcd..." required>
      </div>

      <div class="mb-3">
        <label class="form-label">Montant en EUR</label>
        <input type="number" class="form-control" id="amount" value="10" min="1" step="0.01">
      </div>

      <div class="mb-3">
        <label class="form-label">Réseau blockchain</label>
        <select class="form-select" id="blockchain">
          <option value="base">Base</option>
          <option value="ethereum">Ethereum</option>
        </select>
      </div>

      <button id="startBtn" class="btn btn-primary w-100">🚀 Créer la session Onramp</button>

      <div id="result" class="alert mt-4 d-none"></div>
    </div>
  </div>

  <script>
  document.getElementById('startBtn').addEventListener('click', async () => {
    const wallet = document.getElementById('wallet_address').value.trim();
    const amount = document.getElementById('amount').value.trim();
    const blockchain = document.getElementById('blockchain').value;
    const resultDiv = document.getElementById('result');

    resultDiv.className = 'alert d-none';

    if (!wallet || !amount) {
      alert("Merci de saisir une adresse wallet et un montant.");
      return;
    }

    const apiUrl = '../api/onramp/session.php';

    try {
      const res = await fetch(apiUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          wallet_address: wallet,
          amount: amount,
          fiat_currency: 'EUR',
          assets: ['USDC'],
          blockchain: blockchain
        })
      });

      const text = await res.text();
      let data;
      try {
        data = JSON.parse(text);
      } catch (e) {
        data = { error: 'Réponse non JSON : ' + text };
      }

      if (!res.ok) {
        resultDiv.className = 'alert alert-danger';
        resultDiv.textContent = 'Erreur HTTP ' + res.status + ' : ' + (data.error || text);
        resultDiv.classList.remove('d-none');
        return;
      }

      if (data.success && data.session_url) {
        resultDiv.className = 'alert alert-success';
        resultDiv.innerHTML = '✅ Session créée.<br><a href="' + data.session_url + '" target="_blank" class="btn btn-success mt-2">Ouvrir Coinbase Onramp</a>';
        resultDiv.classList.remove('d-none');
        return;
      }

      resultDiv.className = 'alert alert-warning';
      resultDiv.textContent = data.error || 'Erreur inconnue.';
      resultDiv.classList.remove('d-none');

    } catch (err) {
      resultDiv.className = 'alert alert-danger';
      resultDiv.textContent = 'Erreur JS : ' + err.message;
      resultDiv.classList.remove('d-none');
    }
  });
  </script>
</body>
</html>
